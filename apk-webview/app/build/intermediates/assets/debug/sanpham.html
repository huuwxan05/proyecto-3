<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sản phẩm - Điện Lạnh Lâm Nguyên</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .page-hero { padding: 120px 0 60px; background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 100%); text-align: center; }
        .page-hero h1 { font-size: clamp(2rem, 4vw, 2.5rem); font-weight: 800; margin-bottom: 12px; }
        .products-section { padding: 60px 0; }
        .category-tabs { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
        .cat-tab { padding: 10px 24px; border: 2px solid var(--border-color); background: white; border-radius: 50px; cursor: pointer; font-weight: 600; transition: all 0.3s; font-family: inherit; }
        .cat-tab.active, .cat-tab:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .product-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-8px); }
        .product-img { height: 200px; background: linear-gradient(135deg, #e0f2ff 0%, #b3e5fc 100%); display: flex; align-items: center; justify-content: center; font-size: 4rem; color: var(--primary); }
        .product-info { padding: 20px; }
        .product-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .product-price { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 12px; }
        .product-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 16px; }
        .product-btn { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <div class="nav__logo">
                <i class="fas fa-snowflake"></i>
                <span>Điện Lạnh Lâm Nguyên</span>
            </div>
            <ul class="nav__menu">
                <li class="nav__item"><a href="index.html" class="nav__link">Trang chủ</a></li>
                <li class="nav__item"><a href="banggia.html" class="nav__link">Bảng giá</a></li>
                <li class="nav__item"><a href="sanpham.html" class="nav__link">Sản phẩm</a></li>
                <li class="nav__item"><a href="lienhe.html" class="nav__link">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-hero">
        <div class="container">
            <h1><i class="fas fa-box"></i> Sản phẩm & Thiết bị điện lạnh</h1>
            <p>Danh mục thiết bị điện lạnh chính hãng</p>
        </div>
    </section>

    <section class="products-section">
        <div class="container">
            <div class="category-tabs">
                <button class="cat-tab active" data-cat="all">Tất cả</button>
                <button class="cat-tab" data-cat="dieuhhoa">Điều hòa</button>
                <button class="cat-tab" data-cat="tulanh">Tủ lạnh</button>
                <button class="cat-tab" data-cat="maylanh">Máy lạnh công nghiệp</button>
                <button class="cat-tab" data-cat="phukien">Phụ kiện</button>
            </div>
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </section>

    <script src="js/products.js"></script>
</body>
</html>
